<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cleanova AI · Quét ảnh & Báo giá</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #10B981;
      --primary-dark: #047857;
      --primary-light: #D1FAE5;
      --bg: #F0FDF4;
      --text: #0F172A;
      --muted: #64748B;
      --border: #E2E8F0;
      --danger: #EF4444;
      --warn: #F59E0B;
      --radius: 16px;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px 64px;
    }
    .wrap { max-width: 1080px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 32px; }
    header h1 { font-size: 1.9rem; color: var(--primary-dark); }
    header p { color: var(--muted); margin-top: 6px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 6px 24px rgba(2, 44, 34, .06);
    }
    .card h2 { font-size: 1.1rem; margin-bottom: 14px; color: var(--primary-dark); }

    /* Dropzone */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: .18s;
      background: #FAFFFC;
    }
    .dropzone:hover, .dropzone.drag { border-color: var(--primary); background: var(--primary-light); }
    .dropzone .big { font-size: 2.4rem; }
    .dropzone small { color: var(--muted); display: block; margin-top: 6px; }

    .preview { margin-top: 14px; }
    .preview img {
      width: 100%; border-radius: 12px; border: 1px solid var(--border);
      max-height: 260px; object-fit: cover;
    }

    label.field { display: block; margin-top: 14px; font-size: .88rem; font-weight: 600; }
    input[type=number], select, input[type=text] {
      width: 100%; padding: 10px 12px; margin-top: 6px;
      border: 1px solid var(--border); border-radius: 10px; font-size: .95rem;
    }
    .checks { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    .checks label {
      display: flex; align-items: center; gap: 6px; font-size: .85rem;
      background: #F8FAFC; border: 1px solid var(--border); border-radius: 999px;
      padding: 6px 12px; cursor: pointer;
    }

    button.primary {
      width: 100%; margin-top: 20px; padding: 13px;
      background: var(--primary); color: #fff; font-weight: 700; font-size: 1rem;
      border: none; border-radius: 12px; cursor: pointer; transition: .18s;
    }
    button.primary:hover { background: var(--primary-dark); }
    button.primary:disabled { opacity: .55; cursor: not-allowed; }

    /* Kết quả */
    .hidden { display: none; }
    .score-ring {
      --val: 0;
      width: 132px; height: 132px; border-radius: 50%; margin: 0 auto 8px;
      background: conic-gradient(var(--ring-color, var(--primary)) calc(var(--val) * 1%), #EDF2F7 0);
      display: grid; place-items: center; position: relative;
    }
    .score-ring::after {
      content: ''; width: 100px; height: 100px; border-radius: 50%; background: #fff;
      position: absolute;
    }
    .score-ring .num {
      position: relative; z-index: 1; font-size: 1.9rem; font-weight: 800;
    }
    .level-badge {
      display: inline-block; padding: 5px 14px; border-radius: 999px;
      font-weight: 700; font-size: .85rem; margin-top: 6px;
    }
    .signal { margin-top: 12px; }
    .signal .row { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: 4px; }
    .bar { height: 8px; background: #EDF2F7; border-radius: 999px; overflow: hidden; }
    .bar > span { display: block; height: 100%; border-radius: 999px; }

    .price-total {
      font-size: 2rem; font-weight: 800; color: var(--primary-dark); text-align: center;
      margin: 10px 0 2px;
    }
    .price-range { text-align: center; color: var(--muted); font-size: .9rem; }
    .breakdown { margin-top: 16px; font-size: .88rem; }
    .breakdown .line { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--border); }
    .breakdown .line:last-child { border-bottom: none; font-weight: 700; }
    .tips { margin-top: 14px; }
    .tips li { margin-left: 18px; font-size: .88rem; color: #334155; margin-bottom: 5px; }
    .service-chip {
      display: inline-flex; align-items: center; gap: 8px; background: var(--primary-light);
      color: var(--primary-dark); padding: 7px 14px; border-radius: 999px; font-weight: 700;
      font-size: .9rem; margin-bottom: 8px;
    }
    .status { text-align: center; margin-top: 12px; font-size: .9rem; color: var(--muted); min-height: 20px; }
    .status.error { color: var(--danger); }
    .spinner {
      width: 18px; height: 18px; border: 3px solid #fff; border-top-color: transparent;
      border-radius: 50%; display: inline-block; vertical-align: -3px; margin-right: 8px;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🌿 Cleanova AI</h1>
      <p>Tải ảnh phòng — AI quét độ bẩn & gợi ý mức giá dịch vụ phù hợp</p>
    </header>

    <div class="grid">
      <!-- CỘT NHẬP LIỆU -->
      <section class="card">
        <h2>1. Thông tin phòng</h2>

        <div class="dropzone" id="dropzone">
          <div class="big">📷</div>
          <strong>Nhấn để chọn ảnh</strong> hoặc kéo thả vào đây
          <small>JPEG / PNG / WebP · tối đa 10MB</small>
        </div>
        <input type="file" id="fileInput" accept="image/*" class="hidden">

        <div class="preview hidden" id="preview">
          <img id="previewImg" alt="Ảnh phòng">
        </div>

        <label class="field">Diện tích (m²)
          <input type="number" id="areaSize" value="60" min="10" max="1000" step="5">
        </label>

        <label class="field">Thời gian mong muốn
          <select id="urgency">
            <option value="normal">Bình thường (trước ≥ 2 ngày)</option>
            <option value="soon">Sớm (trong 24–48h) +10%</option>
            <option value="urgent">Gấp (trong 24h) +25%</option>
          </select>
        </label>

        <label class="field">Tình trạng đặc biệt</label>
        <div class="checks">
          <label><input type="checkbox" value="pet_hair"> Lông thú cưng</label>
          <label><input type="checkbox" value="mold"> Nấm mốc</label>
          <label><input type="checkbox" value="grease"> Dầu mỡ bếp</label>
          <label><input type="checkbox" value="post_construction"> Sau xây dựng</label>
        </div>

        <button class="primary" id="analyzeBtn" disabled>🔍 Phân tích & Báo giá</button>
        <div class="status" id="status"></div>
      </section>

      <!-- CỘT KẾT QUẢ -->
      <section class="card">
        <h2>2. Kết quả phân tích</h2>

        <div id="emptyState" style="text-align:center;color:var(--muted);padding:40px 10px">
          <div style="font-size:2.6rem">🧾</div>
          Kết quả AI sẽ hiển thị ở đây sau khi bạn tải ảnh lên.
        </div>

        <div id="result" class="hidden">
          <div style="text-align:center">
            <div class="score-ring" id="scoreRing">
              <span class="num" id="scoreNum">0</span>
            </div>
            <div class="level-badge" id="levelBadge">—</div>
          </div>

          <div id="signals" style="margin-top:18px"></div>

          <hr style="border:none;border-top:1px dashed var(--border);margin:18px 0">

          <div class="service-chip" id="serviceChip">—</div>
          <div class="price-total" id="priceTotal">—</div>
          <div class="price-range" id="priceRange">—</div>

          <div class="breakdown" id="breakdown"></div>

          <div class="tips">
            <strong style="font-size:.9rem">💡 Khuyến nghị</strong>
            <ul id="tips" style="margin-top:8px"></ul>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    // Đổi BASE_URL nếu module AI chạy ở host/cổng khác
    const API_BASE = (location.port === '5100')
      ? `${location.origin}/api/ai`
      : 'http://localhost:5100/api/ai';

    const $ = (id) => document.getElementById(id);
    let selectedFile = null;

    // --- Chọn ảnh ---
    $('dropzone').addEventListener('click', () => $('fileInput').click());
    $('dropzone').addEventListener('dragover', (e) => { e.preventDefault(); e.currentTarget.classList.add('drag'); });
    $('dropzone').addEventListener('dragleave', (e) => e.currentTarget.classList.remove('drag'));
    $('dropzone').addEventListener('drop', (e) => {
      e.preventDefault(); e.currentTarget.classList.remove('drag');
      if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
    });
    $('fileInput').addEventListener('change', (e) => {
      if (e.target.files[0]) setFile(e.target.files[0]);
    });

    function setFile(file) {
      if (!file.type.startsWith('image/')) {
        setStatus('Chỉ chấp nhận file ảnh.', true); return;
      }
      selectedFile = file;
      const url = URL.createObjectURL(file);
      $('previewImg').src = url;
      $('preview').classList.remove('hidden');
      $('analyzeBtn').disabled = false;
      setStatus('');
    }

    function setStatus(msg, isError = false) {
      const el = $('status');
      el.textContent = msg;
      el.className = 'status' + (isError ? ' error' : '');
    }

    // --- Gửi phân tích ---
    $('analyzeBtn').addEventListener('click', async () => {
      if (!selectedFile) return;
      const btn = $('analyzeBtn');
      btn.disabled = true;
      setStatus('Đang phân tích ảnh…');

      const extras = [...document.querySelectorAll('.checks input:checked')].map(c => c.value);
      const form = new FormData();
      form.append('image', selectedFile);
      form.append('areaSize', $('areaSize').value);
      form.append('urgency', $('urgency').value);
      form.append('extras', extras.join(','));

      try {
        const res = await fetch(`${API_BASE}/estimate`, { method: 'POST', body: form });
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.message || 'Phân tích thất bại');
        render(json.data);
        setStatus('Phân tích hoàn tất ✓');
      } catch (err) {
        setStatus('Lỗi: ' + err.message, true);
      } finally {
        btn.disabled = false;
      }
    });

    // --- Hiển thị kết quả ---
    function colorForScore(s) {
      if (s >= 65) return '#EF4444';
      if (s >= 45) return '#F59E0B';
      return '#10B981';
    }
    function severityColor(sev) {
      return sev === 'high' ? '#EF4444' : sev === 'medium' ? '#F59E0B' : '#10B981';
    }

    function render(data) {
      const { analysis, dirtLevel, quote, recommendations } = data;
      $('emptyState').classList.add('hidden');
      $('result').classList.remove('hidden');

      // Điểm bẩn
      const ring = $('scoreRing');
      ring.style.setProperty('--val', analysis.overallScore);
      ring.style.setProperty('--ring-color', colorForScore(analysis.overallScore));
      $('scoreNum').textContent = Math.round(analysis.overallScore);

      const badge = $('levelBadge');
      badge.textContent = `${dirtLevel.label} · bẩn ${Math.round(analysis.overallScore)}/100`;
      badge.style.background = colorForScore(analysis.overallScore) + '22';
      badge.style.color = colorForScore(analysis.overallScore);

      // Các chỉ số
      const sigHtml = analysis.findings.map(f => `
        <div class="signal">
          <div class="row"><span>${f.label}</span><b>${f.score}</b></div>
          <div class="bar"><span style="width:${f.score}%;background:${severityColor(f.severity)}"></span></div>
        </div>`).join('');
      $('signals').innerHTML = sigHtml;

      // Gói dịch vụ & giá
      $('serviceChip').textContent = `${quote.service.icon} ${quote.service.name}`;
      $('priceTotal').textContent = quote.totalPriceLabel;
      $('priceRange').textContent = `Khoảng tham khảo: ${quote.priceRange.label}`;

      // Bóc tách giá
      const b = quote.breakdown;
      $('breakdown').innerHTML = `
        <div class="line"><span>Giá gốc (${quote.areaSize} m² × ${quote.service.pricePerSqm.toLocaleString('vi-VN')}₫)</span><span>${b.basePriceLabel}</span></div>
        <div class="line"><span>Hệ số độ bẩn (${dirtLevel.label})</span><span>${b.dirtMultiplierLabel}</span></div>
        <div class="line"><span>Phụ phí đặc biệt</span><span>${b.extrasLabel}</span></div>
        <div class="line"><span>Phụ phí thời gian</span><span>${b.urgencyLabel}</span></div>
        <div class="line"><span>Tổng cộng</span><span>${quote.totalPriceLabel}</span></div>`;

      // Khuyến nghị
      $('tips').innerHTML = recommendations.map(t => `<li>${t}</li>`).join('');
    }

    // Kiểm tra service ngay khi mở trang
    fetch(`${API_BASE}/health`).catch(() => {
      setStatus('Không kết nối được module AI. Hãy chạy "node server.js" trong ai-module.', true);
    });
  </script>
</body>
</html>
